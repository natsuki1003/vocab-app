<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocabulary Deck Player</title>

  <style>
    :root {
      --bg: #0b0b0d;
      --card: #111113;
      --panel: #1c1c1e;
      --panel-soft: rgba(255, 255, 255, 0.045);
      --text: #f5f5f7;
      --subtext: #d1d1d6;
      --muted: #8e8e93;
      --border: rgba(255, 255, 255, 0.08);
      --border-soft: rgba(255, 255, 255, 0.05);
      --button: #1c1c1e;
      --button-hover: #2c2c2e;
      --accent: #f5f5f7;
      --danger: #ff9f0a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .app {
      width: 100%;
      max-width: 760px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--subtext);
      border: 1px solid var(--border-soft);
      white-space: nowrap;
    }

    .card,
    .deck-menu,
    .controls {
      width: 100%;
      border-radius: 28px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }

    .card {
      padding: 34px;
    }

    .deck-menu {
      padding: 28px;
    }

    .menu-title {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.8px;
      line-height: 1.15;
      margin-bottom: 8px;
    }

    .menu-subtitle {
      color: var(--subtext);
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .deck-list {
      display: grid;
      gap: 12px;
    }

    .deck-button {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      padding: 18px;
      border-radius: 22px;
      border: 1px solid var(--border-soft);
      background: var(--panel-soft);
      color: var(--text);
      text-align: left;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease, opacity 0.15s ease;
    }

    .deck-button:hover {
      background: rgba(255, 255, 255, 0.075);
      transform: translateY(-1px);
    }

    .deck-button:active {
      opacity: 0.75;
      transform: translateY(0);
    }

    .deck-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .deck-description {
      font-size: 15px;
      line-height: 1.5;
      color: var(--subtext);
    }

    .deck-meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .word-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .word {
      font-size: clamp(44px, 8vw, 72px);
      font-weight: 700;
      letter-spacing: -2.2px;
      line-height: 1.02;
    }

    .icon-button {
      width: 56px;
      height: 56px;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: #1c1c1e;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
      flex: 0 0 auto;
    }

    .icon-button:hover {
      transform: scale(1.03);
    }

    .icon-button:active {
      opacity: 0.75;
      transform: scale(0.98);
    }

    .play-icon {
      width: 0;
      height: 0;
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
      border-left: 20px solid #1c1c1e;
      margin-left: 4px;
    }

    .meta-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 26px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      font-size: 14px;
      color: var(--subtext);
      background: var(--panel);
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
    }

    .meaning-block {
      padding: 24px;
      border-radius: 24px;
      background: var(--panel);
      border: 1px solid var(--border-soft);
      margin-bottom: 16px;
    }

    .meaning-main {
      font-size: clamp(30px, 5vw, 42px);
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -0.6px;
      margin-bottom: 8px;
    }

    .short-meaning {
      font-size: 19px;
      color: var(--subtext);
      line-height: 1.6;
    }

    .detail-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .detail-block {
      padding: 20px 22px;
      border-radius: 22px;
      background: var(--panel-soft);
      border: 1px solid var(--border-soft);
    }

    .hidden {
      display: none !important;
    }

    .info-label {
      font-size: 12px;
      letter-spacing: 0.6px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .info-content {
      font-size: 19px;
      line-height: 1.75;
      color: var(--text);
      white-space: pre-line;
    }

    .example-line {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .example-en {
      flex: 1;
      font-size: 21px;
      line-height: 1.65;
      color: var(--text);
      font-weight: 600;
      white-space: pre-line;
    }

    .example-ja {
      margin-top: 10px;
      font-size: 18px;
      line-height: 1.75;
      color: var(--subtext);
      white-space: pre-line;
    }

    .small-audio {
      width: 44px;
      height: 44px;
      margin-top: 3px;
    }

    .small-audio .play-icon {
      border-top-width: 10px;
      border-bottom-width: 10px;
      border-left-width: 15px;
    }

    .done-card {
      text-align: center;
      padding: 40px 24px;
    }

    .done-title {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.6px;
      margin-bottom: 12px;
    }

    .done-text {
      font-size: 17px;
      line-height: 1.7;
      color: var(--subtext);
    }

    .controls {
      margin-top: 16px;
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .button-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .review-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .action-btn,
    .review-btn {
      appearance: none;
      -webkit-appearance: none;
      min-width: 118px;
      height: 44px;
      border: none;
      outline: none;
      padding: 0 18px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      background: var(--button);
      cursor: pointer;
      transition: opacity 0.15s ease, background 0.15s ease;
    }

    .review-btn {
      min-width: 0;
      width: 100%;
      padding: 0 10px;
      font-size: 14px;
    }

    .action-btn:hover,
    .review-btn:hover {
      background: var(--button-hover);
    }

    .action-btn:active,
    .review-btn:active {
      opacity: 0.75;
    }

    .action-btn.primary,
    .review-btn.primary {
      color: #1c1c1e;
      background: var(--accent);
    }

    .setting-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .setting-box {
      padding: 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid var(--border-soft);
    }

    .setting-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 8px;
    }

    select,
    input[type="range"] {
      width: 100%;
    }

    select {
      height: 36px;
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      padding: 0 10px;
      font-family: inherit;
      font-size: 14px;
    }

    input[type="range"] {
      accent-color: var(--accent);
    }

    .notice {
      min-height: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    @media screen and (max-width: 560px) {
      .review-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media screen and (max-width: 480px) {
      body {
        padding: 10px;
        align-items: flex-start;
      }

      .card,
      .deck-menu {
        padding: 24px;
        border-radius: 26px;
      }

      .menu-title {
        font-size: 29px;
      }

      .word {
        letter-spacing: -1.5px;
      }

      .icon-button {
        width: 48px;
        height: 48px;
      }

      .play-icon {
        border-top-width: 11px;
        border-bottom-width: 11px;
        border-left-width: 17px;
      }

      .meaning-block {
        padding: 20px;
        border-radius: 22px;
      }

      .short-meaning,
      .info-content,
      .example-en,
      .example-ja {
        font-size: 17px;
      }

      .detail-block {
        padding: 18px;
        border-radius: 20px;
      }

      .setting-row {
        grid-template-columns: 1fr;
      }

      .action-btn {
        min-width: 104px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="top-bar">
      <div id="progressText">Decks</div>
      <div class="status-pill" id="statusText">Ready</div>
    </div>

    <section class="deck-menu" id="deckMenu">
      <div class="menu-title">Vocabulary Decks</div>
      <div class="menu-subtitle">
        Choose a deck and start learning. Review results are saved in this browser.
      </div>
      <div class="deck-list" id="deckList"></div>
    </section>

    <section class="card hidden" id="studyCard" aria-live="polite">
      <div id="cardContent">
        <div class="word-row">
          <div class="word" id="wordText">Loading</div>
          <button class="icon-button" id="speakWordBtn" type="button" aria-label="Play word audio">
            <span class="play-icon" aria-hidden="true"></span>
          </button>
        </div>

        <div class="meta-row">
          <span class="chip" id="cardNumber">No. --</span>
          <span class="chip" id="partOfSpeech">---</span>
          <span class="chip" id="pronunciation">---</span>
          <span class="chip" id="reviewStatus">New</span>
        </div>

        <div class="meaning-block">
          <div class="meaning-main" id="meaningMain">読み込み中</div>
          <div class="short-meaning" id="shortMeaning">CSVを読み込んでいます。</div>
        </div>

        <div class="detail-list">
          <section class="detail-block" id="collocationBlock">
            <div class="info-label">Collocation</div>
            <div class="info-content" id="collocationText"></div>
          </section>

          <section class="detail-block" id="nuanceBlock">
            <div class="info-label">Nuance</div>
            <div class="info-content" id="nuanceText"></div>
          </section>

          <section class="detail-block" id="exampleBlock">
            <div class="info-label">Example</div>
            <div class="example-line">
              <div class="example-en" id="exampleText"></div>
              <button class="icon-button small-audio" id="speakExampleBtn" type="button" aria-label="Play example audio">
                <span class="play-icon" aria-hidden="true"></span>
              </button>
            </div>
            <div class="example-ja" id="exampleJa"></div>
          </section>

          <section class="detail-block" id="paraphraseBlock">
            <div class="info-label">Paraphrase</div>
            <div class="info-content" id="paraphraseText"></div>
          </section>

          <section class="detail-block" id="memoBlock">
            <div class="info-label">Memo</div>
            <div class="info-content" id="memoText"></div>
          </section>
        </div>
      </div>

      <div class="done-card hidden" id="doneCard">
        <div class="done-title">今日の復習は完了です</div>
        <div class="done-text" id="doneText">
          今表示できるカードはありません。
        </div>
      </div>
    </section>

    <section class="controls hidden" id="controls">
      <div class="button-row">
        <button class="action-btn" id="backToDecksBtn" type="button">Decks</button>
        <button class="action-btn" id="prevBtn" type="button">Prev</button>
        <button class="action-btn" id="nextBtn" type="button">Next</button>
      </div>

      <div class="button-row">
        <button class="action-btn primary" id="autoAudioBtn" type="button">Auto Audio: Off</button>
        <button class="action-btn" id="replayBtn" type="button">Replay</button>
        <button class="action-btn" id="copyBtn" type="button">Copy</button>
      </div>

      <div class="review-row" id="reviewButtons">
        <button class="review-btn" data-rating="hard" type="button">難しい<br>5分後</button>
        <button class="review-btn" data-rating="normal" type="button">普通<br>1日後</button>
        <button class="review-btn" data-rating="easy" type="button">簡単<br>2日後</button>
        <button class="review-btn primary" data-rating="veryEasy" type="button">すごく簡単<br>3日後</button>
      </div>

      <div class="setting-row">
        <div class="setting-box">
          <div class="setting-label">Voice</div>
          <select id="voiceSelect">
            <option value="">Loading voices...</option>
          </select>
        </div>

        <div class="setting-box">
          <div class="setting-label">Speed: <span id="rateValue">0.85</span></div>
          <input id="rateSlider" type="range" min="0.6" max="1.2" step="0.05" value="0.85" />
        </div>
      </div>

      <div class="notice" id="noticeText">Choose a deck to start.</div>
    </section>
  </main>

  <script>
    const DECKS_SOURCE_URL = "./decks.json";
    const REVIEW_STORAGE_KEY = "vocab-app-review-state-v1";
    const AUDIO_STORAGE_KEY = "vocab-app-auto-audio-v1";

    const REVIEW_INTERVALS = {
      hard: 5 * 60 * 1000,
      normal: 24 * 60 * 60 * 1000,
      easy: 2 * 24 * 60 * 60 * 1000,
      veryEasy: 3 * 24 * 60 * 60 * 1000
    };

    const REVIEW_LABELS = {
      hard: "難しい",
      normal: "普通",
      easy: "簡単",
      veryEasy: "すごく簡単"
    };

    const DEFAULT_ALIASES = {
      number: ["番号", "number", "no", "id"],
      word: ["単語", "word", "term", "vocabulary"],
      partOfSpeech: ["品詞", "part_of_speech", "pos", "partOfSpeech"],
      pronunciation: ["発音記号", "pronunciation", "ipa"],
      meaning: ["意味", "meaning_ja", "meaning", "definition_ja"],
      shortMeaning: ["短い意味", "short_meaning_en", "shortMeaning", "short_definition", "simple_definition"],
      nuance: ["ニュアンス解説", "nuance_ja", "nuance", "usage_note"],
      collocation: ["コロケーション", "collocation", "collocations"],
      example: ["例文_英語", "example_en", "example", "sentence"],
      exampleJa: ["例文_日本語", "example_ja", "translation_ja", "translation"],
      paraphrase: ["言い換え", "paraphrase", "synonyms"],
      memo: ["メモ", "memo", "note", "notes"]
    };

    let decks = [];
    let activeDeck = null;
    let cards = [];
    let currentIndex = 0;
    let voices = [];
    let isAutoAudioEnabled = localStorage.getItem(AUDIO_STORAGE_KEY) === "true";
    let audioToken = 0;
    let reviewState = loadReviewState();

    const elements = {
      progressText: document.getElementById("progressText"),
      statusText: document.getElementById("statusText"),
      deckMenu: document.getElementById("deckMenu"),
      deckList: document.getElementById("deckList"),
      studyCard: document.getElementById("studyCard"),
      controls: document.getElementById("controls"),
      cardContent: document.getElementById("cardContent"),
      doneCard: document.getElementById("doneCard"),
      doneText: document.getElementById("doneText"),
      cardNumber: document.getElementById("cardNumber"),
      reviewStatus: document.getElementById("reviewStatus"),
      wordText: document.getElementById("wordText"),
      partOfSpeech: document.getElementById("partOfSpeech"),
      pronunciation: document.getElementById("pronunciation"),
      meaningMain: document.getElementById("meaningMain"),
      shortMeaning: document.getElementById("shortMeaning"),
      collocationBlock: document.getElementById("collocationBlock"),
      nuanceBlock: document.getElementById("nuanceBlock"),
      exampleBlock: document.getElementById("exampleBlock"),
      paraphraseBlock: document.getElementById("paraphraseBlock"),
      memoBlock: document.getElementById("memoBlock"),
      collocationText: document.getElementById("collocationText"),
      nuanceText: document.getElementById("nuanceText"),
      exampleText: document.getElementById("exampleText"),
      exampleJa: document.getElementById("exampleJa"),
      paraphraseText: document.getElementById("paraphraseText"),
      memoText: document.getElementById("memoText"),
      speakWordBtn: document.getElementById("speakWordBtn"),
      speakExampleBtn: document.getElementById("speakExampleBtn"),
      backToDecksBtn: document.getElementById("backToDecksBtn"),
      prevBtn: document.getElementById("prevBtn"),
      nextBtn: document.getElementById("nextBtn"),
      autoAudioBtn: document.getElementById("autoAudioBtn"),
      replayBtn: document.getElementById("replayBtn"),
      copyBtn: document.getElementById("copyBtn"),
      reviewButtons: document.getElementById("reviewButtons"),
      voiceSelect: document.getElementById("voiceSelect"),
      rateSlider: document.getElementById("rateSlider"),
      rateValue: document.getElementById("rateValue"),
      noticeText: document.getElementById("noticeText")
    };

    function setNotice(text) {
      elements.noticeText.textContent = text;
    }

    function normalizeValue(value) {
      return value == null ? "" : String(value).trim();
    }

    function withCacheBust(url) {
      const separator = url.includes("?") ? "&" : "?";
      return `${url}${separator}v=${Date.now()}`;
    }

    function loadReviewState() {
      try {
        const saved = localStorage.getItem(REVIEW_STORAGE_KEY);
        return saved ? JSON.parse(saved) : {};
      } catch (error) {
        return {};
      }
    }

    function saveReviewState() {
      localStorage.setItem(REVIEW_STORAGE_KEY, JSON.stringify(reviewState));
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            cell += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (char === "," && !insideQuotes) {
          row.push(cell);
          cell = "";
        } else if ((char === "\n" || char === "\r") && !insideQuotes) {
          if (char === "\r" && nextChar === "\n") i++;
          row.push(cell);
          rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += char;
        }
      }

      if (cell.length > 0 || row.length > 0) {
        row.push(cell);
        rows.push(row);
      }

      const nonEmptyRows = rows.filter(function (r) {
        return r.some(function (c) { return String(c).trim() !== ""; });
      });

      if (nonEmptyRows.length < 2) return [];

      const headers = nonEmptyRows[0].map(function (header) {
        return normalizeValue(header).replace(/^\uFEFF/, "");
      });

      return nonEmptyRows.slice(1).map(function (r) {
        const item = {};
        headers.forEach(function (header, index) {
          item[header] = normalizeValue(r[index]);
        });
        return item;
      });
    }

    function getValue(row, schema, fieldName) {
      const candidates = [];

      if (schema && schema[fieldName]) {
        if (Array.isArray(schema[fieldName])) {
          candidates.push(...schema[fieldName]);
        } else {
          candidates.push(schema[fieldName]);
        }
      }

      if (DEFAULT_ALIASES[fieldName]) {
        candidates.push(...DEFAULT_ALIASES[fieldName]);
      }

      for (const key of candidates) {
        if (row[key] != null && String(row[key]).trim() !== "") {
          return normalizeValue(row[key]);
        }
      }

      return "";
    }

    function makeCardId(deck, card) {
      const deckId = deck && deck.id ? deck.id : "default";
      const stablePart = card.number || card.word;
      return `${deckId}::${stablePart}`;
    }

    function convertRowsToCards(rows, deck) {
      const schema = deck && deck.schema ? deck.schema : {};

      return rows.map(function (row) {
        const card = {
          number: getValue(row, schema, "number"),
          word: getValue(row, schema, "word"),
          partOfSpeech: getValue(row, schema, "partOfSpeech"),
          pronunciation: getValue(row, schema, "pronunciation"),
          meaning: getValue(row, schema, "meaning"),
          shortMeaning: getValue(row, schema, "shortMeaning"),
          nuance: getValue(row, schema, "nuance"),
          collocation: getValue(row, schema, "collocation"),
          example: getValue(row, schema, "example"),
          exampleJa: getValue(row, schema, "exampleJa"),
          paraphrase: getValue(row, schema, "paraphrase"),
          memo: getValue(row, schema, "memo")
        };

        card.cardId = makeCardId(deck, card);
        return card;
      }).filter(function (card) {
        return card.word;
      });
    }

    function getRecord(card) {
      return reviewState[card.cardId] || null;
    }

    function isCardDue(card) {
      const record = getRecord(card);
      if (!record || !record.dueAt) return true;
      return Number(record.dueAt) <= Date.now();
    }

    function getDueCards() {
      return cards.filter(isCardDue);
    }

    function findNextDueIndex(startIndex) {
      if (!cards.length) return -1;

      for (let step = 1; step <= cards.length; step++) {
        const index = (startIndex + step) % cards.length;
        if (isCardDue(cards[index])) return index;
      }

      return -1;
    }

    function findFirstDueIndex() {
      return cards.findIndex(isCardDue);
    }

    function getNextDueTimeText() {
      let nextDueAt = null;

      cards.forEach(function (card) {
        const record = getRecord(card);
        if (!record || !record.dueAt) {
          nextDueAt = Date.now();
          return;
        }

        const dueAt = Number(record.dueAt);
        if (!nextDueAt || dueAt < nextDueAt) {
          nextDueAt = dueAt;
        }
      });

      if (!nextDueAt) return "次の復習予定はありません。";

      const date = new Date(nextDueAt);
      return `次の復習予定: ${date.toLocaleString()}`;
    }

    function showDoneCard() {
      cancelAudio();
      elements.cardContent.classList.add("hidden");
      elements.doneCard.classList.remove("hidden");
      elements.reviewButtons.classList.add("hidden");
      elements.progressText.textContent = activeDeck ? `${activeDeck.title} · Done` : "Done";
      elements.doneText.textContent = getNextDueTimeText();
      setNotice("今日表示できるカードはありません。復習予定日以降にまた開いてください。");
    }

    function showStudyContent() {
      elements.cardContent.classList.remove("hidden");
      elements.doneCard.classList.add("hidden");
      elements.reviewButtons.classList.remove("hidden");
    }

    async function loadDecks() {
      try {
        const response = await fetch(withCacheBust(DECKS_SOURCE_URL), { cache: "no-store" });
        if (!response.ok) throw new Error("decks.json could not be loaded.");
        decks = await response.json();

        if (!Array.isArray(decks) || decks.length === 0) {
          throw new Error("No decks found.");
        }

        renderDeckMenu();
      } catch (error) {
        elements.deckList.innerHTML = "";
        const message = document.createElement("div");
        message.className = "deck-description";
        message.textContent = "decks.json を読み込めませんでした。GitHubに decks.json があるか確認してください。";
        elements.deckList.appendChild(message);
      }
    }

    function renderDeckMenu() {
      cancelAudio();
      elements.deckMenu.classList.remove("hidden");
      elements.studyCard.classList.add("hidden");
      elements.controls.classList.add("hidden");
      elements.progressText.textContent = "Decks";
      elements.statusText.textContent = "Ready";

      elements.deckList.innerHTML = "";

      decks.forEach(function (deck) {
        const button = document.createElement("button");
        button.className = "deck-button";
        button.type = "button";

        const title = document.createElement("div");
        title.className = "deck-title";
        title.textContent = deck.title || "Untitled Deck";

        const description = document.createElement("div");
        description.className = "deck-description";
        description.textContent = deck.description || deck.file || "";

        const meta = document.createElement("div");
        meta.className = "deck-meta";
        meta.textContent = deck.schemaName ? `CSV format: ${deck.schemaName}` : "CSV format: default";

        button.appendChild(title);
        button.appendChild(description);
        button.appendChild(meta);

        button.addEventListener("click", function () {
          loadCardsFromDeck(deck);
        });

        elements.deckList.appendChild(button);
      });
    }

    async function loadCardsFromDeck(deck) {
      cancelAudio();
      activeDeck = deck;
      elements.statusText.textContent = "Loading";
      elements.deckMenu.classList.add("hidden");
      elements.studyCard.classList.remove("hidden");
      elements.controls.classList.remove("hidden");
      elements.progressText.textContent = "Loading...";
      setNotice(`${deck.title} を読み込んでいます。`);

      try {
        const response = await fetch(withCacheBust(deck.file), { cache: "no-store" });
        if (!response.ok) throw new Error("CSV file could not be loaded.");

        const csvText = await response.text();
        const rows = parseCSV(csvText);
        cards = convertRowsToCards(rows, deck);

        if (!cards.length) throw new Error("No valid cards found.");

        const firstDueIndex = findFirstDueIndex();
        if (firstDueIndex === -1) {
          showDoneCard();
          elements.statusText.textContent = "Ready";
          return;
        }

        currentIndex = firstDueIndex;
        renderCard();
        elements.statusText.textContent = "Ready";
        setNotice(`${cards.length}枚中、今すぐ学習できるカードは${getDueCards().length}枚です。`);
      } catch (error) {
        cards = [];
        renderNoData();
        elements.statusText.textContent = "Ready";
        setNotice("CSVを読み込めませんでした。ファイル名・パス・CSVヘッダー・decks.jsonのschemaを確認してください。");
      }
    }

    function getCurrentCard() {
      return cards[currentIndex] || null;
    }

    function toggleBlock(block, value) {
      if (!block) return;
      block.classList.toggle("hidden", !value);
    }

    function renderNoData() {
      showStudyContent();
      elements.progressText.textContent = "0 / 0";
      elements.wordText.textContent = "No data";
      elements.cardNumber.textContent = "No. --";
      elements.partOfSpeech.textContent = "---";
      elements.pronunciation.textContent = "---";
      elements.reviewStatus.textContent = "No data";
      elements.meaningMain.textContent = "CSVデータがありません";
      elements.shortMeaning.textContent = "CSVの場所・ヘッダー・schema設定を確認してください。";
      elements.collocationText.textContent = "";
      elements.nuanceText.textContent = "";
      elements.exampleText.textContent = "";
      elements.exampleJa.textContent = "";
      elements.paraphraseText.textContent = "";
      elements.memoText.textContent = "";
      toggleBlock(elements.collocationBlock, false);
      toggleBlock(elements.nuanceBlock, false);
      toggleBlock(elements.exampleBlock, false);
      toggleBlock(elements.paraphraseBlock, false);
      toggleBlock(elements.memoBlock, false);
    }

    function renderCard() {
      const card = getCurrentCard();

      if (!card) {
        renderNoData();
        return;
      }

      showStudyContent();

      const record = getRecord(card);
      const dueCards = getDueCards();

      elements.progressText.textContent = activeDeck
        ? `${activeDeck.title} · ${currentIndex + 1} / ${cards.length}`
        : `${currentIndex + 1} / ${cards.length}`;

      elements.wordText.textContent = card.word;
      elements.cardNumber.textContent = card.number ? `No. ${card.number}` : "No. --";
      elements.partOfSpeech.textContent = card.partOfSpeech || "---";
      elements.pronunciation.textContent = card.pronunciation || "---";
      elements.reviewStatus.textContent = record ? `Review ${record.reviews || 0}` : "New";
      elements.meaningMain.textContent = card.meaning || "---";
      elements.shortMeaning.textContent = card.shortMeaning || "";
      elements.collocationText.textContent = card.collocation || "";
      elements.nuanceText.textContent = card.nuance || "";
      elements.exampleText.textContent = card.example || "";
      elements.exampleJa.textContent = card.exampleJa || "";
      elements.paraphraseText.textContent = card.paraphrase || "";
      elements.memoText.textContent = card.memo || "";

      toggleBlock(elements.collocationBlock, card.collocation);
      toggleBlock(elements.nuanceBlock, card.nuance);
      toggleBlock(elements.exampleBlock, card.example || card.exampleJa);
      toggleBlock(elements.paraphraseBlock, card.paraphrase);
      toggleBlock(elements.memoBlock, card.memo);

      setNotice(`今すぐ学習できるカード: ${dueCards.length}枚`);

      if (isAutoAudioEnabled) {
        playCurrentCardSequence();
      }
    }

    function loadVoices() {
      voices = window.speechSynthesis.getVoices();

      const englishVoices = voices.filter(function (voice) {
        return voice.lang && voice.lang.toLowerCase().startsWith("en");
      });

      elements.voiceSelect.innerHTML = "";

      if (englishVoices.length === 0) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "Default English voice";
        elements.voiceSelect.appendChild(option);
        return;
      }

      englishVoices.forEach(function (voice) {
        const option = document.createElement("option");
        option.value = voice.name;
        option.textContent = `${voice.name} (${voice.lang})`;
        elements.voiceSelect.appendChild(option);
      });

      const preferred = englishVoices.find(function (voice) {
        const name = voice.name.toLowerCase();
        return name.includes("samantha") || name.includes("daniel") || name.includes("google") || name.includes("natural");
      });

      if (preferred) {
        elements.voiceSelect.value = preferred.name;
      }
    }

    function getSelectedVoice() {
      const selectedName = elements.voiceSelect.value;
      return voices.find(function (voice) {
        return voice.name === selectedName;
      }) || null;
    }

    function cancelAudio() {
      audioToken++;
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      elements.statusText.textContent = "Ready";
    }

    function speak(text, token) {
      return new Promise(function (resolve, reject) {
        if (!text) {
          resolve();
          return;
        }

        if (!("speechSynthesis" in window)) {
          reject(new Error("This browser does not support speech synthesis."));
          return;
        }

        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-US";
        utterance.rate = Number(elements.rateSlider.value);
        utterance.pitch = 1;
        utterance.volume = 1;

        const selectedVoice = getSelectedVoice();
        if (selectedVoice) {
          utterance.voice = selectedVoice;
          utterance.lang = selectedVoice.lang;
        }

        utterance.onstart = function () {
          if (token === audioToken) elements.statusText.textContent = "Speaking";
        };

        utterance.onend = function () {
          if (token === audioToken) elements.statusText.textContent = "Ready";
          resolve();
        };

        utterance.onerror = function (event) {
          if (token === audioToken) elements.statusText.textContent = "Ready";
          reject(event.error || new Error("Speech error."));
        };

        window.speechSynthesis.speak(utterance);
      });
    }

    function wait(ms) {
      return new Promise(function (resolve) {
        setTimeout(resolve, ms);
      });
    }

    async function playCurrentCardSequence() {
      const card = getCurrentCard();
      if (!card) return;

      const token = ++audioToken;

      try {
        await speak(card.word, token);
        if (token !== audioToken) return;

        await wait(650);
        if (token !== audioToken) return;

        await speak(card.example, token);
        if (token !== audioToken) return;

        elements.statusText.textContent = "Ready";
      } catch (error) {
        if (token === audioToken) {
          setNotice("音声を再生できませんでした。別のVoiceを選ぶか、手動再生を試してください。");
          elements.statusText.textContent = "Ready";
        }
      }
    }

    function updateAutoAudioButton() {
      elements.autoAudioBtn.textContent = isAutoAudioEnabled ? "Auto Audio: On" : "Auto Audio: Off";
      elements.autoAudioBtn.classList.toggle("primary", isAutoAudioEnabled);
    }

    function toggleAutoAudio() {
      isAutoAudioEnabled = !isAutoAudioEnabled;
      localStorage.setItem(AUDIO_STORAGE_KEY, String(isAutoAudioEnabled));
      updateAutoAudioButton();

      if (isAutoAudioEnabled) {
        setNotice("Auto AudioをONにしました。カード表示時に単語と例文を自動再生します。");
        playCurrentCardSequence();
      } else {
        cancelAudio();
        setNotice("Auto AudioをOFFにしました。再生ボタンを押した時だけ音声を再生します。");
      }
    }

    function goToPreviousCard() {
      cancelAudio();
      if (!cards.length) return;
      currentIndex = (currentIndex - 1 + cards.length) % cards.length;
      renderCard();
    }

    function goToNextCard() {
      cancelAudio();
      if (!cards.length) return;
      currentIndex = (currentIndex + 1) % cards.length;
      renderCard();
    }

    function goToNextDueCard() {
      const nextIndex = findNextDueIndex(currentIndex);

      if (nextIndex === -1) {
        showDoneCard();
        return;
      }

      currentIndex = nextIndex;
      renderCard();
    }

    function reviewCurrentCard(rating) {
      const card = getCurrentCard();
      if (!card) return;

      const now = Date.now();
      const oldRecord = getRecord(card) || {};
      const interval = REVIEW_INTERVALS[rating] || REVIEW_INTERVALS.normal;
      const dueAt = now + interval;

      reviewState[card.cardId] = {
        dueAt: dueAt,
        lastReviewedAt: now,
        lastRating: rating,
        reviews: (oldRecord.reviews || 0) + 1,
        interval: interval
      };

      saveReviewState();

      const dueText = new Date(dueAt).toLocaleString();
      setNotice(`${card.word}: ${REVIEW_LABELS[rating]} と記録しました。次回予定: ${dueText}`);

      goToNextDueCard();
    }

    function copyCurrentWord() {
      const card = getCurrentCard();
      if (!card) return;

      const word = card.word;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(word)
          .then(function () {
            setNotice(`Copied: ${word}`);
          })
          .catch(function () {
            setNotice("Copy failed.");
          });
      } else {
        setNotice("Copy is not supported in this browser.");
      }
    }

    elements.speakWordBtn.addEventListener("click", function () {
      cancelAudio();
      const card = getCurrentCard();
      if (!card) return;
      const token = ++audioToken;
      speak(card.word, token).catch(function () {
        setNotice("音声を再生できませんでした。");
      });
    });

    elements.speakExampleBtn.addEventListener("click", function () {
      cancelAudio();
      const card = getCurrentCard();
      if (!card) return;
      const token = ++audioToken;
      speak(card.example, token).catch(function () {
        setNotice("音声を再生できませんでした。");
      });
    });

    elements.backToDecksBtn.addEventListener("click", renderDeckMenu);
    elements.prevBtn.addEventListener("click", goToPreviousCard);
    elements.nextBtn.addEventListener("click", goToNextCard);
    elements.autoAudioBtn.addEventListener("click", toggleAutoAudio);

    elements.replayBtn.addEventListener("click", function () {
      playCurrentCardSequence();
    });

    elements.copyBtn.addEventListener("click", copyCurrentWord);

    elements.reviewButtons.addEventListener("click", function (event) {
      const button = event.target.closest("button[data-rating]");
      if (!button) return;
      reviewCurrentCard(button.dataset.rating);
    });

    elements.rateSlider.addEventListener("input", function () {
      elements.rateValue.textContent = elements.rateSlider.value;
    });

    if ("speechSynthesis" in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    } else {
      elements.voiceSelect.innerHTML = '<option value="">Not supported</option>';
    }

    updateAutoAudioButton();
    loadDecks();
  </script>
</body>
</html>
